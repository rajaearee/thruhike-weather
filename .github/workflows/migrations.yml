name: Daily live migrations
on:
  schedule:
    - cron: '47 9 * * *'   # once a day, 09:47 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  migrations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node fetch-migrations.mjs
      - name: Publish
        run: |
          git config user.name "migrations-bot"
          git config user.email "migrations-bot@users.noreply.github.com"
          git add migrations.json taxa.json
          git diff --cached --quiet || git commit -m "Migrations $(date -u +%F)"
          git push
